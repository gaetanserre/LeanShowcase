name = "showcase"
version = "0.1.0"
keywords = ["documentation", "website"]
description = "A website for the readers of a Lean formalization: its results, what they rest on, and their proofs."
defaultTargets = ["showcase"]

[[lean_lib]]
name = "Showcase"

[[lean_exe]]
name = "showcase"
root = "Main"
# The pretty-printer runs the delaborators of the formalization (e.g. Mathlib's notations).
supportInterpreter = true
